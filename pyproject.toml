[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "request-triage"
version = "1.0.0"
description = "LLM triage for free-form internal requests"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
# UP042 pushes (str, Enum) towards enum.StrEnum. Kept deliberately: this is the
# form pydantic validation and the provider schema builder are exercised
# against, and StrEnum changes what str() returns on the members.
ignore = ["UP042", "E501"]
